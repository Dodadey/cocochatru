<style>
/* Layout: the Metropolis sleeve as a site. Paper ground, hard spot-colour blocks, circles and rings; photos full-bleed, text on a narrow measure. */
:root{
  --paper:#F1ECDD; --paper2:#E8E1CD; --ink:#13110E; --mute:#5E584D; --line:#9C958A;
  --red:#D33B2C; --blue:#1F4E9E; --mustard:#E6A922; --green:#2E7D4F;
  --night:#13110E; --cream:#F1ECDD;
  --display:"Archivo","Arial Black",Impact,sans-serif;
  --body:"Jost","Futura","Century Gothic",sans-serif;
  --mono:"DM Mono","Courier New",monospace;
  --pad:clamp(1rem,4vw,3.25rem);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#15130F;--paper2:#1E1B16;--ink:#F1ECDD;--mute:#B3AC9E;--line:#5E584D;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15130F;--paper2:#1E1B16;--ink:#F1ECDD;--mute:#B3AC9E;--line:#5E584D;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-stretch:125%;font-weight:900;line-height:.92;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1.page{font-size:clamp(2.6rem,10vw,8rem);margin-bottom:.35em}
h2{font-size:clamp(1.9rem,5vw,3.6rem)}
h3{font-size:1.45rem;line-height:1.05}
p{margin:0 0 1em}
.wrap{padding:clamp(2.5rem,7vw,5.5rem) var(--pad)}
.measure{max-width:40rem}
.lede{font-size:1.25rem;line-height:1.5;max-width:36rem}
.mono{font-family:var(--mono);font-size:.82rem;letter-spacing:.02em}
.mute{color:var(--mute)}
.btn{display:inline-block;font-weight:600;text-decoration:none;padding:.7rem 1.15rem;background:var(--ink);color:var(--paper);border:2px solid var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.draft{font-family:var(--mono);font-size:.72rem;border:1px dashed currentColor;padding:.05rem .4rem;margin-left:.4rem;vertical-align:middle;opacity:.7}
.dot{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:-.05em;margin-right:.5em}
.ring{display:inline-block;width:.95em;height:.95em;border-radius:50%;border:.26em solid var(--mustard);vertical-align:-.12em;margin-right:.45em}
.rings{aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,var(--mustard) 0 4.2%,transparent 4.2% 8.4%)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:1rem;padding:.65rem var(--pad)}
.logo{display:flex;align-items:center;text-decoration:none;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:1.05rem;letter-spacing:.02em;white-space:nowrap}
nav.main{display:flex;gap:1.3rem;margin-left:auto}
nav.main a{text-decoration:none;font-weight:500;font-size:.95rem;border-bottom:2px solid transparent;padding:.15rem 0}
nav.main a[aria-current="page"]{border-bottom-color:var(--red)}
nav.main a:hover{border-bottom-color:var(--ink)}
.tools{display:flex;gap:.5rem;align-items:center}
.lang{display:flex;border:1.5px solid var(--ink)}
.lang button{font-family:var(--mono);font-size:.78rem;padding:.15rem .5rem}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.cartbtn{font-weight:600;font-size:.9rem;border:1.5px solid var(--ink);padding:.2rem .6rem;white-space:nowrap}
.cartbtn b{display:inline-block;min-width:1.4em;text-align:center;background:var(--red);color:#fff;margin-left:.35rem;border-radius:1em;font-size:.8rem}
.menu{display:none;border:1.5px solid var(--ink);padding:.15rem .6rem;font-weight:600}
@media (max-width:1040px){
  nav.main{display:none;position:absolute;left:0;right:0;top:100%;background:var(--paper);flex-direction:column;gap:0;border-bottom:1px solid var(--line);padding:.4rem var(--pad) 1rem}
  nav.main.open{display:flex}
  nav.main a{padding:.6rem 0;font-size:1.15rem;border-bottom:1px solid var(--line)}
  .menu{display:block;margin-left:auto}
  .logo .full{display:none}
}
@media (max-width:460px){.top{gap:.45rem}.logo{font-size:.9rem}.cartbtn .w{display:none}}

/* hero: the stage */
.hero{position:relative;overflow:hidden;background:var(--night);color:var(--cream);display:flex;align-items:flex-end;min-height:clamp(27rem,58vw,43rem)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:grayscale(1) contrast(1.05)}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(0deg,rgba(19,17,14,.88),rgba(19,17,14,0) 60%)}
.hero .slab{position:relative;z-index:2;display:grid;grid-template-columns:auto 1fr;width:100%}
.hero .tile{background:var(--red);color:#fff;padding:1.3rem var(--pad);display:flex;flex-direction:column;justify-content:flex-end;gap:.3rem;text-decoration:none;min-width:min(19rem,100%)}
.hero .tile b{font-family:var(--display);font-stretch:125%;font-size:clamp(2.2rem,5vw,3.8rem);line-height:.9}
.hero .tile:hover{background:var(--blue)}
.hero h1{font-size:clamp(2.7rem,9vw,8.5rem);line-height:.86;padding:1.2rem var(--pad) .6rem}
.hero .lede{padding:0 var(--pad) 1.4rem;color:var(--cream)}
.hero .rings{position:absolute;z-index:2;width:clamp(6rem,18vw,15rem);right:var(--pad);top:var(--pad)}
@media (max-width:700px){.hero .slab{grid-template-columns:1fr}.hero .slab>div{order:-1}.hero::before{background:linear-gradient(0deg,rgba(19,17,14,.94) 40%,rgba(19,17,14,.15) 85%)}.hero .lede{font-size:1.05rem}.hero>img{object-position:22% 40%}}
@media (prefers-reduced-motion:no-preference){.hero .rings{animation:pop .9s cubic-bezier(.2,.8,.2,1) both}@keyframes pop{from{scale:.3;opacity:0}}}

/* next up */
.next{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.next a{display:block;text-decoration:none;padding:1.4rem var(--pad);border-right:1px solid var(--line)}
.next a:last-child{border-right:0}
.next b{display:block;font-family:var(--display);font-stretch:125%;font-size:clamp(1.7rem,3.6vw,2.6rem);line-height:1}
.next span{display:block}
.next a:hover b{color:var(--red)}
@media (max-width:760px){.next{grid-template-columns:1fr}.next a{border-right:0;border-bottom:1px solid var(--line)}.next a:last-child{border-bottom:0}}

/* release: the machine */
.relC{background:var(--night);color:var(--cream);display:grid;grid-template-columns:1.1fr 1fr}
.relC .copy{padding:clamp(2rem,6vw,4.5rem) var(--pad);display:flex;flex-direction:column;justify-content:center;gap:1.4rem;min-width:0}
.relC h2{font-size:clamp(2.4rem,7vw,6.2rem);line-height:.86}
.relC h2 span{display:block}
.relC h2 span:nth-child(2){color:var(--mustard)}
.relC .when{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(1.3rem,2.6vw,2rem);color:var(--red);line-height:1}
.relC .lede{color:var(--cream)}
.relC .btn{background:var(--mustard);border-color:var(--mustard);color:var(--night)}
.relC .btn.ghost{background:transparent;border-color:var(--cream);color:var(--cream)}
.relC .btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.relC .img{position:relative;overflow:hidden;min-height:22rem}
.relC .img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.relC .img::after{content:"";position:absolute;inset:0;background:var(--blue);mix-blend-mode:color;opacity:.6}
@media (max-width:820px){.relC{grid-template-columns:1fr}.relC .img{min-height:0;aspect-ratio:1}}

/* shelf */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:clamp(1rem,3vw,2rem)}
.shelf a{text-decoration:none}
.shelf img{aspect-ratio:1;object-fit:cover;width:100%}
.shelf .cap{display:flex;justify-content:space-between;margin-top:.6rem;font-weight:600}
.headrow{display:flex;justify-content:space-between;align-items:end;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem}

/* live strip */
.strip{display:grid;grid-template-columns:2fr 1fr 1.5fr;gap:4px;background:var(--night)}
.strip img{width:100%;height:clamp(220px,34vw,460px);object-fit:cover;filter:grayscale(1) contrast(1.1)}
.strip img.dan{object-position:38% 40%}
@media (max-width:700px){.strip{grid-template-columns:1fr}.strip img{height:60vw}}

/* press */
.press{background:var(--paper2);border-bottom:1px solid var(--line)}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:2.2rem 3rem;margin-top:2rem}
.quotes figure{margin:0;padding-left:1rem;border-left:4px solid var(--c,var(--blue))}
.quotes blockquote{margin:0 0 .6rem;font-style:italic;font-size:1.12rem;line-height:1.45}
.quotes figcaption{font-weight:600;font-size:.9rem;color:var(--mute)}
.bigquote{background:var(--red);color:#fff;padding:clamp(1.5rem,4vw,2.5rem);margin:2.5rem 0 0;position:relative;overflow:hidden}
.bigquote blockquote{margin:0;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(1.6rem,4.5vw,3.4rem);line-height:1;padding-right:4rem}
.bigquote figcaption{color:var(--mustard);font-weight:600;margin-top:.8rem}
.bigquote::after{content:"";position:absolute;right:-2.5rem;top:-2.5rem;width:9rem;aspect-ratio:1;border-radius:50%;background:var(--mustard)}

/* motto */
.motto{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(1.7rem,5vw,4rem);line-height:.98;color:transparent;-webkit-text-stroke:1.4px var(--ink);margin:0}
.motto .r{-webkit-text-stroke-color:var(--red)}
.motto .b{-webkit-text-stroke-color:var(--blue)}
.motto-cap{display:flex;align-items:center;gap:.8rem;margin-top:1.2rem}
.motto-cap::before{content:"";flex:none;width:3rem;height:.4rem;background:var(--blue)}
.cocoband{display:grid;grid-template-columns:1fr auto;gap:2rem;align-items:center;border-bottom:1px solid var(--line)}
.cocoband .rings{width:clamp(8rem,22vw,18rem)}
@media (max-width:700px){.cocoband{grid-template-columns:1fr}.cocoband .rings{display:none}}

/* players */
.bandintro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,26rem);gap:clamp(1.5rem,5vw,4rem);align-items:start}
.bandintro img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 30%}
@media (max-width:820px){.bandintro{grid-template-columns:1fr}}
.players{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.player .ph{aspect-ratio:760/657;overflow:hidden}
.player .ph img{width:100%;height:100%;object-fit:cover}
.player .bar{padding:1rem 1.2rem 1.1rem;color:#fff}
.player .bar h3{font-family:var(--body);font-weight:600;font-stretch:100%;font-size:1.5rem;letter-spacing:0}
.player .bar .mono{text-transform:uppercase;opacity:.9;line-height:1.5;display:block;margin-top:.3rem}
.player .bio{padding:1.2rem}
@media (max-width:1000px){.players{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.players{grid-template-columns:1fr}}
.studio{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--night)}
.studio img{width:100%;aspect-ratio:4/3;object-fit:cover}
@media (max-width:760px){.studio{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* albums */
.album{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:clamp(1.5rem,4vw,3.5rem);padding:clamp(2rem,5vw,3.5rem) 0;border-top:1px solid var(--line)}
.album img.cov{width:100%;aspect-ratio:1;object-fit:cover}
.sides{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.8rem 2.5rem;margin:1.8rem 0}
.side h4{font-family:var(--body);font-weight:600;letter-spacing:.3em;text-transform:uppercase;margin:0 0 .4rem;font-size:.95rem}
.side ol{list-style:none;margin:0;padding:0}
.side li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.8rem;padding:.28rem 0;border-bottom:1px solid var(--line)}
.side li small{color:var(--mute);font-size:.82rem;margin-left:.35rem;white-space:nowrap}
.side li .mono{color:var(--mute);font-variant-numeric:tabular-nums}
.illus{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--night);margin-top:1rem}
.illus img{width:100%;aspect-ratio:3/4;object-fit:cover}
.tracks{padding:0;margin:0 0 1.4rem;list-style:none;columns:2;column-gap:2rem}
.tracks li{break-inside:avoid;border-bottom:1px solid var(--line);padding:.25rem 0}
.credits{font-size:.95rem;color:var(--mute)}
@media (max-width:760px){.album{grid-template-columns:1fr}.sides{grid-template-columns:1fr}.tracks{columns:1}}

/* gigs */
.rows{border-top:3px solid var(--ink)}
.row{display:grid;grid-template-columns:minmax(8rem,13rem) minmax(0,1fr);gap:1.5rem;padding:1.1rem 0;border-bottom:1px solid var(--line);align-items:baseline}
.row .when{font-family:var(--display);font-stretch:125%;font-weight:900;font-size:1.7rem;line-height:1}
.tag{font-family:var(--mono);font-size:.72rem;background:var(--mustard);color:var(--night);padding:.1rem .45rem;margin-left:.5rem;vertical-align:middle;white-space:nowrap}
@media (max-width:640px){.row{grid-template-columns:1fr;gap:.3rem}}

/* media */
.videos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:clamp(1rem,3vw,2rem)}
.vframe{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--night);color:var(--cream)}
.vframe img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.6)}
.vframe .lbl{position:absolute;left:1rem;bottom:.9rem;right:1rem}
.vframe .lbl b{display:block;font-family:var(--display);font-stretch:125%;font-size:1.3rem;line-height:1.05}
.vframe .play{position:absolute;left:50%;top:44%;translate:-50% -50%;width:3.6rem;aspect-ratio:1;border-radius:50%;border:.35rem solid var(--mustard)}
.gallery{columns:3 260px;column-gap:6px}
.gallery figure{margin:0 0 6px;break-inside:avoid;position:relative}
.gallery img{width:100%}
.gallery figcaption{font-family:var(--mono);font-size:.72rem;color:var(--mute);padding:.3rem 0 .5rem}

.uc{max-width:46rem;background:var(--mustard);color:var(--night)}
.uc .stripes{height:1.1rem;background:repeating-linear-gradient(-45deg,var(--night) 0 .9rem,var(--mustard) .9rem 1.8rem)}
.uc-body{display:flex;gap:1.2rem;align-items:center;padding:1.6rem clamp(1.2rem,4vw,2.2rem)}
.uc-body .ring{width:3.2rem;height:3.2rem;border-width:.7rem;border-color:var(--night);flex:none;margin:0}
.uc b{display:block;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:clamp(1.8rem,5vw,3rem);line-height:.95}
.uc p{margin:.5rem 0 0;max-width:30rem}
/* about coco */
.coco{display:grid;grid-template-columns:minmax(0,40rem) minmax(0,1fr);gap:clamp(2rem,6vw,5rem);align-items:start}
.coco .body p:first-child{font-size:1.3rem;line-height:1.45}
.coco h3{margin:2rem 0 .7rem;font-size:1.25rem}
.dropcap{display:inline-grid;place-items:center;width:1.35em;height:1.35em;font-family:var(--display);font-weight:900;color:#fff;background:var(--red);margin-right:.18em;line-height:1;vertical-align:-.15em}
.swan{aspect-ratio:1;position:sticky;top:5rem}
.swan .c1{position:absolute;inset:0 22% 22% 0;border-radius:50%;background:var(--blue)}
.swan .c2{position:absolute;inset:34% 0 0 34%}
.swan .c3{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;background:var(--red);left:28%;top:28%}
.facts{list-style:none;padding:0;margin:2rem 0 0;border-top:3px solid var(--ink)}
.facts li{display:grid;grid-template-columns:7rem minmax(0,1fr);gap:1rem;padding:.6rem 0;border-bottom:1px solid var(--line)}
.facts b{font-family:var(--display);font-stretch:125%;font-size:1.15rem}
@media (max-width:820px){.coco{grid-template-columns:1fr}.swan{position:relative;top:0;max-width:300px}}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:clamp(1.2rem,3vw,2.2rem)}
.item img,.item .merch{aspect-ratio:1;width:100%;object-fit:cover}
.item .merch{display:grid;place-items:center;color:#fff;font-family:var(--display);font-stretch:125%;font-weight:900;font-size:2.4rem}
.item h3{font-family:var(--body);font-stretch:100%;font-weight:600;font-size:1.25rem;margin:.7rem 0 .1rem;letter-spacing:0}
.item .price{font-weight:600;margin:.2rem 0 .7rem}
.item .btn{width:100%;text-align:center}
.item .btn[disabled]{background:transparent;color:var(--mute);border-color:var(--line);cursor:default}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--paper);z-index:50;border-left:1px solid var(--line);transform:translateX(100%);visibility:hidden;transition:transform .3s ease,visibility .3s;display:flex;flex-direction:column;padding:calc(1.2rem + env(safe-area-inset-top,0px)) 1.4rem calc(1.2rem + env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none;visibility:visible}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
.drawer header{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--ink);padding-bottom:.6rem}
.drawer{overflow-y:auto;overscroll-behavior:contain}
.lines{list-style:none;margin:0;padding:0}
.lines li{display:grid;grid-template-columns:1fr auto;gap:.3rem 1rem;padding:.8rem 0;border-bottom:1px solid var(--line)}
.qty{display:flex;gap:.35rem;align-items:center}
.qty button{border:1.5px solid var(--ink);width:1.8rem;height:1.8rem;font-weight:700}
.total{display:flex;justify-content:space-between;font-weight:600;font-size:1.2rem;padding:1rem 0}
.order{display:grid;gap:.9rem;border-top:3px solid var(--ink);padding-top:1rem}
.order h3{font-family:var(--body);font-stretch:100%;font-weight:600;font-size:1.25rem;letter-spacing:0}
.order label{display:grid;gap:.25rem;font-weight:500;font-size:.92rem}

const g=k=>GT[lang][k];
let game=store.get("ccq-game",null), setup=null, busy=false, forkResolve=null, armed=null;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const d6=()=>1+Math.floor(Math.random()*6);
const cur=()=>game.players[game.turn];
const pname=p=>p.name||`${g("player")} ${game.players.indexOf(p)+1}`;
const saveGame=()=>store.set("ccq-game",game);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function say(fn,...a){game.msg=[fn,...a]}
function msgText(){if(!game||!game.msg)return "";const[k,...a]=game.msg;const v=g(k);return typeof v==="function"?v(...a):v}

function gameView(){return `<section class="wrap" style="padding-bottom:2rem">
  <h1 class="page" style="font-size:clamp(2.6rem,8vw,6rem)">${g("title")}</h1>
  <p class="lede">${g("intro")}</p>
  <div class="actions"><a class="btn ghost" target="_blank" rel="noopener" href="https://open.spotify.com/search/Coco%20Chatru%20Quartet%20Limbokolia">${g("album")}</a></div></section>
 <section class="gwrap">
  <div class="board" id="board"><img src="${IMG.limbo_board}" alt="${g("alt")}"><div id="forks"></div><div id="pcs"></div></div>
  <div class="gpanel" id="gpanel"></div>
 </section>
 <section class="wrap" style="padding-top:0"><details class="grules"><summary>${g("rulesH")}</summary><ol>${g("rules").map(r=>`<li>${r}</li>`).join("")}</ol></details></section>`}

function gameMount(){ if(!game&&!setup) setup={players:[{name:"",tok:0},{name:"",tok:1}]}; drawPanel(); drawPieces() }

function pos(id){const n=GB.nodes[id];return [n.x,n.y]}
function drawPieces(){
  const el=$("#pcs"); if(!el) return;
  const fk=$("#forks"); fk.innerHTML=(game&&game.fork||[]).map(id=>{const[x,y]=pos(id);return `<button class="fork" data-fork="${id}" style="left:${x}%;top:${y}%" aria-label="${g("fork")}"></button>`}).join("");
  if(!game){el.innerHTML="";return}
  const groups={};game.players.forEach((p,i)=>(groups[p.pos]=groups[p.pos]||[]).push(i));
  const sig=game.players.map(p=>p.tok+p.col).join();
  if(el.dataset.sig!==sig){el.dataset.sig=sig;el.innerHTML=game.players.map((p,i)=>`<span class="pc" data-pc="${i}" style="--c:${p.col}">${p.tok}</span>`).join("")}
  Object.entries(groups).forEach(([id,ids])=>{
    const[x,y]=pos(id); const big=["S","B","L"].includes(id); const r=ids.length>1?(big?4.2:2.2):0;
    ids.forEach((i,k)=>{const a=-Math.PI/2+k*2*Math.PI/ids.length;const s=el.querySelector(`[data-pc="${i}"]`);
      s.style.left=(x+r*Math.cos(a))+"%";s.style.top=(y+r*Math.sin(a)*1.01)+"%";
      s.classList.toggle("now",game.phase==="play"&&i===game.turn)})
  });
}
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const dieHTML=n=>`<div class="die" aria-label="${n||""}">${Array.from({length:9},(_,i)=>`<i${n&&PIPS[n].includes(i)?' class="on"':""}></i>`).join("")}</div>`;

function drawPanel(){
  const el=$("#gpanel"); if(!el) return;
  if(!game){
    el.innerHTML=`<h3>${g("players")}</h3><p class="mute" style="font-size:.92rem">${g("tokHint")}</p>
     <div class="plist">${setup.players.map((p,i)=>`<div class="prow"><button class="tok" data-tok="${i}" style="--c:${PCOL[i]}" aria-label="token">${TOKENS[p.tok]}</button>
       <input data-name="${i}" value="${esc(p.name)}" placeholder="${g("player")} ${i+1}" aria-label="${g("name")}" maxlength="18">
       ${setup.players.length>2?`<button class="x" data-rm="${i}" aria-label="${g("remove")}">×</button>`:""}</div>`).join("")}</div>
     <div class="actions" style="margin-top:1rem">${setup.players.length<6?`<button class="btn ghost" id="gAdd">${g("add")}</button>`:""}<button class="btn" id="gStart">${g("start")}</button></div>`;
    return;
  }
  const p=cur(), over=game.phase==="over";
  const status=game.players.map((q,i)=>`<li class="${!over&&i===game.turn?"now":""}"><span class="tok sm" style="--c:${q.col}">${q.tok}</span><span>${esc(pname(q))}</span><span class="mono mute">${q.pos==="S"?g("atStart"):q.pos==="L"?g("there"):q.pos==="B"?(q.pick?g("waitShort")(q.pick):g("inBox")):""}</span></li>`).join("");
  let act="";
  if(over) act=`<button class="btn" id="gAgain">${g("again")}</button>`;
  else if(game.pending==="pick") act=`<p><b>${g("pick")}</b></p><div class="nums">${[1,2,3,4,5,6].map(n=>`<button class="btn ghost" data-pick="${n}">${n}</button>`).join("")}</div>`;
  else if(game.pending==="bump") act=`<div class="actions">${game.victims.map(i=>`<button class="btn" data-bump="${i}">${esc(g("send")(pname(game.players[i])))}</button>`).join("")}<button class="btn ghost" data-bump="-1">${g("skip")}</button></div>`;
  else if(game.fork) act=`<p><b>${g("fork")}</b></p>`;
  else act=`<button class="btn big" id="gRoll" ${busy?"disabled":""}>${g("roll")}</button>`;
  el.innerHTML=`${over?"":`<div class="who"><span class="tok" style="--c:${p.col}">${p.tok}</span><h3>${esc(g("turn")(pname(p)))}</h3></div>`}
   <div class="rollrow">${dieHTML(game.die)}<p class="gmsg" aria-live="polite">${esc(msgText())}</p></div>
   <div class="act">${act}</div>
   <ul class="standing">${status}</ul>
   ${over?"":`<div class="actions" style="margin-top:1.2rem"><button class="btn gong" id="gGong">${armed==="gong"?g("gongSure"):"◎ "+g("gong")}</button></div>`}
   <button class="linkish" id="gNew">${armed==="new"?g("sureNew"):g("newGame")}</button>`;
}

function startGame(){
  const ps=setup.players.map((p,i)=>({name:p.name.trim(),tok:TOKENS[p.tok],col:PCOL[i],pos:"S",trail:["S"],pick:null}));
  game={players:ps,turn:0,phase:"play",die:null,pending:null,fork:null,msg:null};
  let pool=ps.map((_,i)=>i), parts=[];
  while(pool.length>1){const r=pool.map(i=>[i,d6()]);parts.push(r.map(([i,v])=>`${pname(ps[i])} ${v}`).join(", "));const m=Math.max(...r.map(x=>x[1]));pool=r.filter(x=>x[1]===m).map(x=>x[0])}
  game.turn=pool[0]; say("rollOff",parts.join(" · "),pname(ps[pool[0]]));
  setup=null; saveGame(); drawPanel(); drawPieces();
}
async function animateRoll(){let v;for(let i=0;i<7;i++){v=d6();game.die=v;const d=$(".die");if(d)d.outerHTML=dieHTML(v);await sleep(60)}return v}
function chooseFork(opts){game.fork=opts;drawPieces();drawPanel();return new Promise(r=>forkResolve=r)}
async function move(p,steps,G0){
  for(let k=0;k<steps;k++){
    const opts=GB.next[p.pos]; if(!opts) break;
    const to=opts.length>1?await chooseFork(opts):opts[0];
    if(game!==G0||game.phase!=="play") return;
    p.pos=to;p.trail.push(to);drawPieces();await sleep(190);
    if(to==="B") break;
  }
  const j=GB.jump[p.pos];
  if(game!==G0||game.phase!=="play") return;
  if(j){say("arrow");drawPanel();await sleep(450);p.pos=j;p.trail.push(j);drawPieces();await sleep(500)}
}
async function takeTurn(){
  if(busy||game.phase!=="play"||game.pending) return;
  busy=true; drawPanel(); const G0=game, p=cur(); const r=await animateRoll(); game.die=r;
  const gone=()=>game!==G0||game.phase!=="play";
  if(p.pos==="B"){
    if(r===p.pick){p.pos="L";p.trail.push("L");return finish([p],"win")}
    say("boxFail",pname(p),r,p.pick);drawPanel();await sleep(700);if(gone())return;p.pos="S";p.trail=["S"];p.pick=null;drawPieces();return endTurn();
  }
  if(GB.double.includes(p.pos)&&r<3){say("stuck",pname(p),r);return endTurn()}
  say("rolled",pname(p),r);drawPanel();
  await move(p,r,G0); if(gone()) return;
  if(p.pos==="B"){game.pending="pick";busy=false;saveGame();drawPanel();return}
  const v=game.players.map((q,i)=>i).filter(i=>game.players[i]!==p&&game.players[i].pos===p.pos&&p.pos!=="S");
  if(v.length){game.pending="bump";game.victims=v;game.bumpN=r;say("bump",pname(p),v.map(i=>pname(game.players[i])).join(g("and")),r);busy=false;saveGame();drawPanel();return}
  endTurn();
}
function endTurn(){game.turn=(game.turn+1)%game.players.length;game.pending=null;game.fork=null;busy=false;saveGame();drawPanel();drawPieces()}
function finish(ws,kind){ws.forEach(w=>{w.pos="L"});game.phase="over";game.pending=null;busy=false;
  if(kind==="nobody")say("nobody");else say(kind,ws.map(pname).join(g("and")));saveGame();drawPanel();drawPieces()}

document.addEventListener("click",e=>{
  if(route()!=="limbokolia") return;
  const el=e.target.closest("button"); if(!el) return;
  if(el.id!=="gGong"&&el.id!=="gNew"&&armed){armed=null;drawPanel()}
  if(el.dataset.tok!==undefined){const p=setup.players[+el.dataset.tok];p.tok=(p.tok+1)%TOKENS.length;drawPanel()}
  else if(el.dataset.rm!==undefined){setup.players.splice(+el.dataset.rm,1);drawPanel()}
  else if(el.id==="gAdd"){const used=setup.players.map(p=>p.tok);setup.players.push({name:"",tok:TOKENS.findIndex((_,i)=>!used.includes(i))});drawPanel()}
  else if(el.id==="gStart") startGame();
  else if(el.id==="gRoll") takeTurn();
  else if(el.dataset.fork&&forkResolve){const f=forkResolve;forkResolve=null;game.fork=null;drawPieces();drawPanel();f(el.dataset.fork)}
  else if(el.dataset.pick){const p=cur();p.pick=+el.dataset.pick;say("waiting",pname(p),p.pick);endTurn()}
  else if(el.dataset.bump!==undefined){const i=+el.dataset.bump;if(i>=0){const q=game.players[i];for(let k=0;k<game.bumpN&&q.trail.length>1;k++)q.trail.pop();q.pos=q.trail[q.trail.length-1];say("sent",pname(q),game.bumpN)}endTurn()}
  else if(el.id==="gGong"){if(armed!=="gong"){armed="gong";drawPanel();return}armed=null;forkResolve=null;game.fork=null;
    const ws=game.players.filter(p=>p.pos==="B");ws.length?finish(ws,"gongWin"):finish([],"nobody")}
  else if(el.id==="gNew"||el.id==="gAgain"){if(el.id==="gNew"&&armed!=="new"){armed="new";drawPanel();return}
    armed=null;const prev=game?game.players:null;game=null;forkResolve=null;busy=false;store.set("ccq-game",null);
    setup={players:prev?prev.map(p=>({name:p.name,tok:Math.max(0,TOKENS.indexOf(p.tok))})):[{name:"",tok:0},{name:"",tok:1}]};drawPanel();drawPieces()}
});

  if(e.target.closest("#backOrder")){orderSent=null;renderCart()}
  const cp=e.target.closest("#copyOrder");
  if(cp){const done=()=>{cp.textContent=t("oCopied")};const sel=()=>{const r=document.createRange();r.selectNodeContents($("#orderPre"));const w=getSelection();w.removeAllRanges();w.addRange(r)};
    try{navigator.clipboard.writeText(orderSent).then(done,sel)}catch(err){sel()}}
  const lb=e.target.closest("[data-lang]");if(lb){lang=lb.dataset.lang;store.set("ccq-lang",lang);render()}
});
$("#cartBtn").addEventListener("click",()=>openCart(true));
$("#menuBtn").addEventListener("click",()=>{const o=$("#nav").classList.toggle("open");$("#menuBtn").setAttribute("aria-expanded",o)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#drawer").classList.contains("open"))openCart(false)});
window.addEventListener("hashchange",()=>{render();window.scrollTo(0,0);$("#main").focus({preventScroll:true})});
render();
</script>
</body>
</html>
